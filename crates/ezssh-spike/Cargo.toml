[package]
name = "ezssh-spike"
description = "Phase 1 spike: ezssh-term over a local PTY and one SSH session in a bare eframe window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ezssh-term = { path = "../ezssh-term" }
eframe = { version = "0.37", features = ["glow"] }
portable-pty = "0.9"
russh = "0.64"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rpassword = "7"
directories = "6"
zeroize = "1.9"
png = "0.18"
open = "5"
