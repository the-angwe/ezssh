[package]
name = "ezssh-app"
description = "ezSsh native app: the eframe shell around ezssh-core and ezssh-term"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ezssh"
path = "src/main.rs"

[dependencies]
ezssh-core = { path = "../ezssh-core" }
ezssh-term = { path = "../ezssh-term" }
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
# SVG icons (Lucide, rendered by resvg).
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# System UI font lookup, same version as ezssh-term.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
open = "5"
zeroize = "1.9"
# Native open / save dialogs (backup, restore, sync, import; SFTP in phase 6).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3"
# The system font fallback eframe installs in the real window.
egui_system_font_provider = "0.37"
