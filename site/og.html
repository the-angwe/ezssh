<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ezSsh OG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#181A1E;color:#E6E8ED;font-family:"Instrument Sans",system-ui,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:-200px auto auto -100px;width:900px;height:700px;background:radial-gradient(50% 50% at 50% 50%,rgba(108,166,245,.28),transparent 70%)}
.in{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;font-family:"Schibsted Grotesk";font-weight:700;font-size:40px;letter-spacing:-.01em}
.brand img{width:64px;height:64px;border-radius:15px}
h1{font-family:"Schibsted Grotesk";font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-.03em;margin:0;max-width:980px}
h1 em{font-style:normal;color:#6CA6F5}
p{margin:22px 0 0;font-size:26px;color:#B4B9C4;max-width:900px;line-height:1.4}
.foot{font-family:"JetBrains Mono";font-size:18px;color:#8B919E;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:28px}
.foot b{color:#6CA6F5;font-weight:500}
</style></head><body>
<div class="glow"></div>
<div class="in">
  <div class="brand"><img src="assets/icon.svg" alt="">ezSsh</div>
  <div><h1>Every server, one window. <em>No webview.</em></h1><p>Free, open-source SSH client with a session manager, encrypted vault, real terminal, SFTP pane, WSL, port forwards and X11. One native Rust program.</p></div>
  <div class="foot"><span><b>&gt;</b> free · GPLv3</span><span><b>&gt;</b> Windows · Linux · macOS</span><span><b>&gt;</b> github.com/the-angwe/ezssh</span></div>
