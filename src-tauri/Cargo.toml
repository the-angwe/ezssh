[package]
name = "ezterm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Free Windows SSH client (MobaXterm-style)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ezssh-core = { path = "../crates/ezssh-core" }

tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pre-release channel lookup (GitHub releases API) in the updater commands.
# rustls-tls matches the rest of our TLS stack (no OpenSSL dep).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
