name: release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-beta.N`) to build and publish a draft
# release of the native ezSsh app, or run it by hand from the Actions tab
# (build only). The tag must equal the version in Cargo.toml: the binary
# reports that version to the updater, so a mismatch would make every
# install offer the same update again.
#
# Per platform (cargo-packager 0.11, config in crates/ezssh-app/Cargo.toml):
#   Windows x64      NSIS setup.exe + MSI (both carry VcXsrv)
#   Linux x64/arm64  AppImage + deb
#   macOS arm64      ezSsh.app as .app.tar.gz (unsigned, not notarised)
# plus a portable .tar.xz for each (with a portable.txt marker, so the
# in-app updater links to the release instead of replacing it).
#
# The release job signs every installer with the update key
# (`ezssh-release sign`, secret EZSSH_SIGNING_KEY + _PASSWORD), checks the
# signatures against crates/ezssh-core/updater.pub, and writes latest.json.
# Without the secret it still publishes the draft, with no latest.json, so
# no installed copy is offered that release. One-time setup:
# docs/UPDATER_SIGNING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# No workflow-level permissions block: each job declares what it needs
# (build = read; release / prune = write). Only the release job sees the
# signing key.

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset` is the platform token of the portable archive's name.
          - name: windows-x86_64
            asset: windows-x64
            os: windows-latest
            formats: nsis,wix
            bin: ezssh.exe
          - name: linux-x86_64
            asset: linux-amd64
            os: ubuntu-latest
            formats: deb,appimage
            bin: ezssh
          - name: linux-aarch64
            asset: linux-aarch64
            os: ubuntu-24.04-arm
            formats: deb,appimage
            bin: ezssh
          - name: macos-aarch64
            asset: macos-aarch64
            os: macos-latest
            formats: app
            bin: ezssh

    steps:
      - uses: actions/checkout@v5

      - name: Version (tag must match Cargo.toml)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9] ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$CARGO_VER" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says ${CARGO_VER}; bump Cargo.toml and tag again"
              exit 1
            fi
          fi
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"
          echo "version $CARGO_VER"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.name }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      # Build: the xkb / xcb headers eframe compiles against. Packaging:
      # `file` for linuxdeploy; the AppImage tools run extracted (no FUSE on
      # the runners). No webkit2gtk any more.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            file xz-utils

      # VcXsrv via Chocolatey (SourceForge mirrors are unreliable from CI),
      # staged at target/vcxsrv: cargo-packager ships it in both installers
      # (resources) and the portable archive copies it next to ezssh.exe.
      - name: Stage VcXsrv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vcxsrv -y --no-progress --limit-output
          if (-not (Test-Path 'C:\Program Files\VcXsrv\vcxsrv.exe')) {
            Write-Error 'VcXsrv install missing vcxsrv.exe'
            exit 1
          }
          New-Item -ItemType Directory -Force -Path 'target\vcxsrv' | Out-Null
          Copy-Item 'C:\Program Files\VcXsrv\*' 'target\vcxsrv\' -Recurse -Force
          Write-Host "Staged VcXsrv: $((Get-ChildItem 'target\vcxsrv' -Recurse | Measure-Object -Sum Length).Sum) bytes"

      # before-packaging-command builds target/dist/ezssh (profile dist).
      - name: Package
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          cargo packager -p ezssh-app -f "${{ matrix.formats }}" -v
          ls -la target/packages

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p installers
          shopt -s nullglob
          for f in target/packages/*-setup.exe target/packages/*.msi \
                   target/packages/*.AppImage target/packages/*.deb; do
            cp -v "$f" installers/
          done
          if [ "${{ runner.os }}" = "macOS" ]; then
            # The updater unpacks this and swaps the bundle; the name carries
            # version and arch like every other installer.
            tar -C target/packages -czf "installers/ezssh_${VER}_aarch64.app.tar.gz" ezSsh.app
          fi
          ls -la installers
          [ -n "$(ls -A installers)" ] || { echo "::error::no installers built"; exit 1; }

      - name: Portable archive
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          PORTABLE="ezSsh_${VER}_${{ matrix.asset }}-portable"
          STAGE="stage/${PORTABLE}"
          mkdir -p "$STAGE"
          cp "target/dist/${{ matrix.bin }}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          cp crates/ezssh-app/packaging/portable.txt "$STAGE/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p "$STAGE/vcxsrv"
            cp -r target/vcxsrv/. "$STAGE/vcxsrv/"
          fi
          tar -C stage -cJf "${PORTABLE}.tar.xz" "${PORTABLE}"
          ls -l "${PORTABLE}.tar.xz"

      - name: Upload portable archive
        uses: actions/upload-artifact@v5
        with:
          name: portable-${{ matrix.name }}
          path: ezSsh_*-portable.tar.xz
          if-no-files-found: error
          retention-days: 7

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish draft release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Small: minisign + serde_json, nothing of the app.
      - name: Build ezssh-release
        run: cargo build -p ezssh-release --release --locked

      - name: Sign installers and write latest.json
        working-directory: artifacts
        env:
          EZSSH_SIGNING_KEY: ${{ secrets.EZSSH_SIGNING_KEY }}
          EZSSH_SIGNING_KEY_PASSWORD: ${{ secrets.EZSSH_SIGNING_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TOOL=../target/release/ezssh-release
          VER="${TAG#v}"
          shopt -s nullglob
          INSTALLERS=(*-setup.exe *.msi *.AppImage *.deb *.app.tar.gz)
          ls -la
          if [ -z "${EZSSH_SIGNING_KEY:-}" ]; then
            echo "::warning::EZSSH_SIGNING_KEY is not set: no signatures, no latest.json (installed copies will not be offered this release)"
            exit 0
          fi
          "$TOOL" sign --version "$VER" "${INSTALLERS[@]}"
          # The key that signed must be the one the app trusts.
          "$TOOL" verify --pubkey ../crates/ezssh-core/updater.pub --version "$VER" "${INSTALLERS[@]}"
          "$TOOL" manifest --dir . --version "$VER" \
            --base-url "https://github.com/${REPO}/releases/download/${TAG}" \
            --notes "../docs/release-notes/${TAG}.md"
          cat latest.json
          # Every URL in the manifest must be an asset of this release.
          missing=0
          while IFS= read -r url; do
            [ -f "${url##*/}" ] || { echo "::error::latest.json names missing asset ${url##*/}"; missing=1; }
          done < <(jq -r '.platforms | to_entries[] | .value.url' latest.json)
          [ "$missing" = 0 ]

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          sha256sum *.tar.xz *-setup.exe *.msi *.AppImage *.deb *.app.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/release-notes/${TAG}.md"
          shopt -s nullglob
          ASSETS=(artifacts/*.tar.xz artifacts/SHA256SUMS
                  artifacts/*-setup.exe artifacts/*.msi artifacts/*.AppImage artifacts/*.deb artifacts/*.app.tar.gz
                  artifacts/*.sig artifacts/latest.json)
          FLAGS=(--title "$TAG" --draft)
          # vX.Y.Z-beta.N is a pre-release: only the pre-release channel offers it.
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          if [ -f "$NOTES_FILE" ]; then
            FLAGS+=(--notes-file "$NOTES_FILE")
          else
            echo "No $NOTES_FILE, generating notes"
            FLAGS+=(--generate-notes)
          fi
          gh release create "$TAG" "${FLAGS[@]}" "${ASSETS[@]}"

  prune:
    name: prune old releases
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      # Counts every release, drafts and pre-releases included.
      RELEASES_TO_KEEP: 20
    steps:
      - name: Delete releases + tags beyond the cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t TO_DELETE < <(
            gh release list --limit 1000 --json tagName,createdAt \
              | jq -r --argjson keep "$RELEASES_TO_KEEP" 'sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName'
          )
          echo "To delete: ${#TO_DELETE[@]}"
          for tag in "${TO_DELETE[@]}"; do
            [ -z "$tag" ] && continue
            echo "Deleting release + tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
