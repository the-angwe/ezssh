name: ci

# Runs on every pull request and on pushes to main. Two independent jobs:
#
#   rust   — cargo check (warnings are errors), clippy, tests
#   audit  — cargo audit against the RustSec database (.cargo/audit.toml
#            lists the accepted, unfixable advisories)
#
# release.yml is the only place installers are built; nothing here
# produces artifacts.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same set as release.yml: the xkb / xcb headers eframe builds
      # against. Fonts and the GPU are loaded at run time.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Warnings are errors here, matching the repo rule that cargo check
      # must be clean before every commit.
      - name: cargo check
        run: cargo check --workspace --locked --all-targets
        env:
          RUSTFLAGS: -D warnings

      - name: cargo clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads .cargo/audit.toml for the ignore list. Fails on any new
      # vulnerability; unmaintained / unsound notices stay warnings.
      - name: cargo audit
        run: cargo audit
